name: Minimum Go

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - "*"

jobs:
  minimum:
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: "0"

    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.26.x"

      - name: Run tests
        run: go test -v ./...
